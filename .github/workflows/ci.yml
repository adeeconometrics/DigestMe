name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, test, and typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint:ci

      - name: Test with coverage
        run: npm test

      - name: Typecheck
        run: npm run typecheck

  python-ci:
    name: Python engine lint, test, and typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Typecheck
        run: uv run mypy

      - name: Lint
        run: uv run pylint src/engine src/cli py-tests

      - name: Test
        run: uv run pytest

  semgrep:
    name: Semgrep security scan
    runs-on: ubuntu-latest
    # Skip any PR created by dependabot to avoid permission issues.
    if: (github.actor != 'dependabot[bot]')
    container:
      # Official Semgrep OSS image with the CLI preinstalled.
      image: semgrep/semgrep:1.172.0
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run Semgrep security scan
        run: |
          semgrep scan \
            --config p/owasp-top-ten \
            --config p/javascript \
            --config p/cwe-top-25 \
            --config p/secrets \
            --config p/security-audit \
            --error \
            --metrics=off \
            .

  build:
    name: Build static site
    runs-on: ubuntu-latest
    needs: [checks, python-ci, semgrep]
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
